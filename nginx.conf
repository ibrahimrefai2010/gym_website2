server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /var/www/muscle-fitness/public;
        try_files $uri $uri/ /index.html;
    }
}

# Women's Branch -- same Node app as above. Branch resolution happens in
# Node via req.hostname (see src/middleware/branchResolver.js), not here;
# nginx's only job is to route the subdomain to the same backend/static root.
#
# INFRA TASK (outside this repo's control, not something this migration can
# provision): before this block can serve traffic, someone with DNS/server
# access needs to:
#   1. Add a DNS A/AAAA record for women.yourdomain.com pointing at this host.
#   2. Issue a cert for it, e.g.:
#        certbot certonly --nginx -d women.yourdomain.com
#      (or add it to the existing cert with -d yourdomain.com -d women.yourdomain.com
#      and point both server_name entries at the same cert files).
server {
    listen 443 ssl;
    server_name women.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/women.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/women.yourdomain.com/privkey.pem;

    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /var/www/muscle-fitness/public;
        try_files $uri $uri/ /index.html;
    }
}
