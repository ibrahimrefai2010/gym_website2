<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Verify a Muscle and Fitness Center membership.">
    <meta name="theme-color" content="#080808">
    <meta name="robots" content="noindex">
    <title>Muscle and Fitness Center | Membership Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/assets/css/styles.css?v=2.1.0">
  </head>
  <body>
    <main class="card-verify-shell">
      <section class="card-verify" id="verifyCard" aria-live="polite">
        <div class="auth-topline">
          <span class="eyebrow" data-i18n="card.verify.title">Membership verification</span>
          <div class="language-switch" aria-label="Language">
            <button type="button" data-lang-toggle="en" aria-pressed="true">EN</button>
            <button type="button" data-lang-toggle="ar" aria-pressed="false">ع</button>
          </div>
        </div>
        <div id="verifyBody">
          <div class="state-block" role="status" data-i18n="portal.loading">Loading…</div>
        </div>
      </section>
    </main>

    <script src="/assets/js/data.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/ux-copy.js"></script>
    <script src="/assets/js/portal-i18n.js"></script>
    <script src="/assets/js/card-verify.js?v=2.1.0"></script>
    <script src="/assets/js/demo-banner.js"></script>
  </body>
</html>
